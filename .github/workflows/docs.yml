name: Docs

# Builds the documentation site with Zensical and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["docs/**", "zensical.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Check the live site
        run: |
          sleep 30
          for page in "" guide/ troubleshooting/ how-it-works/ building/ assets/icon.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}$page")
            echo "$code ${{ steps.deployment.outputs.page_url }}$page"
            [ "$code" = "200" ]
          done
