[project]
name = "sightline"
version = "1.0.0"
description = "Moves keyboard focus to the screen, window you look at, using your webcam."
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "PySide6>=6.6",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.6", "pillow>=10"]

[project.scripts]
sightline = "sightline.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sightline"]
